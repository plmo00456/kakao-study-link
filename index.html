<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>공부 모드 자동 답장</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f7f7f7;
      color: #222;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    }

    main {
      width: min(560px, calc(100% - 48px));
      padding: 36px;
      border-radius: 18px;
      background: white;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: 26px;
    }

    p {
      line-height: 1.7;
      color: #555;
    }
  </style>
</head>
<body>
  <main>
    <h1>공부 모드 사용 중입니다</h1>
    <p>현재 공부 또는 업무에 집중하고 있어 답장이 늦을 수 있습니다.</p>
    <p>이 페이지는 개인정보를 수집하지 않습니다.</p>
  </main>
</body>
</html>
